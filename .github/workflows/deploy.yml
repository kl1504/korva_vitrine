name: Korva CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  security-scan:
    name: Code Analysis, Vulnerability Scan & Leaks Detection
    runs-on: self-hosted
    permissions:
        contents: read
        pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          scannerVersion: 6.2.0.4584
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build the project
    runs-on: ubuntu-24.04
    needs: security-scan
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check if the tests pass
        run: docker compose run --rm korva-vitrine-dev npm test --if-present

      - name: Construire l'image Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: image_website:${{ github.sha }}

      - name: Exporter l'image en fichier tar
        run: docker save image_website:${{ github.sha }} -o /tmp/image_website.tar

      - name: Uploader l'image Docker en artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image_website.tar
          retention-days: 2
  
  image-scan:
    name: Scan the Docker image to check vulnerabilities
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
           persist-credentials: false
      - name: Download the Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image from tar
        run: docker load -i /tmp/image_website.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: image_website:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-report.sarif'
          severity: 'CRITICAL, HIGH'
          exit-code : '0'
          ignore-unfixed: true
        
      - name: Upload the Trivy report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-report.sarif
          retention-days: 2
      

  deploy:
    name: Deploy the project
    runs-on: self-hosted
    needs: image-scan
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download the Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image_website.tar

      - name: Start Docker Containers
        run: docker compose up -d

      - name: Récupérer l'IP local du runner
        id: local_ip
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "L'adresse IP locale de ce runner est : $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Valider l'accès via l'IP et le port
        run: |
          sleep 10
          echo "Site accessible sur : http://${{ steps.local_ip.outputs.ip }}:8085"
          curl -v http://${{ steps.local_ip.outputs.ip }}:8085

      - name: Docker Clean Up
        run: docker image prune -f

  dast_scan:
    name: Dynamic Analysis with OWASP ZAP
    runs-on: ubuntu-24.04
    needs: deploy
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan DAST with OWASP ZAP
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://172.20.20.23:8085'
          cmd_options: '-a'
          fail_action: false
          artifact_name: 'zap-raw-html-report'

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Convert ZAP report into PDF
        run: |
          wkhtmltopdf --enable-local-file-access report_html.html zap-vulnerability-report.pdf

      - name: Publish the report
        uses: actions/upload-artifact@v4
        with:
          name: zap-vulnerability-report-pdf
          path: zap-vulnerability-report.pdf
          retention-days: 2

  send_email:
    name: Send the reports by email
    runs-on: ubuntu-24.04
    needs: [image-scan, dast_scan]
    permissions:
      contents: read
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download the Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: .

      - name: Download the ZAP report
        uses: actions/download-artifact@v4
        with:
          name: zap-vulnerability-report-pdf
          path: .

      - name: Send email with reports
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Security Reports regarding the project Korva - ${{ github.sha }}"
          to: ${{ secrets.MAIL_TO }}
          from: KORVA Deployment Team
          body: |
            Hello Team,

            Please find attached the latest security reports for the Korva project.

            1. Trivy Vulnerability Report (SARIF format)
            2. OWASP ZAP Dynamic Analysis Report (PDF format)

            Best regards,
            Kael Avande,
            KORVA Deployment Team
          attachments: trivy-report.sarif, zap-vulnerability-report.pdf

            





