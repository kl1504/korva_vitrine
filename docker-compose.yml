services:
    korva-vitrine:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        ports:
            - "8085:3000"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s