services:
    korva-vitrine:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        ports:
            - "8085:3000"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://127.0.0.1:8085"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s